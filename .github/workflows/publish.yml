name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native compiler
        timeout-minutes: 2
        run: |
          rustc --version --verbose
          directory="$(mktemp -d)"
          printf '#[test]\nfn compiler_smoke() {}\n' > "$directory/smoke.rs"
          time rustc --edition 2024 --test "$directory/smoke.rs" -o "$directory/smoke"
          "$directory/smoke"
      - name: Create release PR or publish
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'

    <path d="M8 275h324" stroke="#344431"/>
    <text x="26" y="261" fill="#d1d6c9">my-project /</text>
    <g fill="#9eac94" font-size="15">
      <text x="26" y="301">├─ granary.json</text>
      <text x="26" y="325" fill="#d6a252">├─ granary-lock.json</text>
      <rect x="20" y="329" width="296" height="28" rx="3" fill="#a6c58b14" stroke="#a6c58b35"/>
      <text x="26" y="349" fill="#c6dcab">├─ AGENTS.md</text>
      <text x="26" y="379">└─ .granary/context/</text>
      <text x="46" y="403">└─ github/vercel/next.js/</text>

<svg xmlns="http://www.w3.org/2000/svg" width="340" height="490" viewBox="0 0 340 490" fill="none">
  <title>A manifest becomes local, versioned reference files</title>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <rect x="8" y="1" width="324" height="194" rx="6" fill="#0b1211" stroke="#40503a"/>
    <path d="M8 41h324" stroke="#2e3c30"/>
    <rect x="24" y="15" width="8" height="8" fill="#d6a252"/>
    <text x="44" y="27" fill="#d1d6c9">granary.json</text>
    <text x="24" y="65" fill="#9eac94" font-size="14">Next.js selection</text>
    <g fill="#b6c1af" font-size="15">
      <text x="24" y="87">{</text>
      <text x="44" y="107"><tspan fill="#d6a252">"tag"</tspan>: "v16.0.0",</text>
      <text x="44" y="127"><tspan fill="#d6a252">"files"</tspan>: {</text>
      <text x="64" y="147"><tspan fill="#d6a252">"include"</tspan>: ["docs/**"]</text>
      <text x="44" y="167">}</text>
      <text x="24" y="187">}</text>
    </g>
    <path d="M170 203v22m-6-7 6 7 6-7" stroke="#d6a252" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">A directory is a context pack</title>
  <desc id="desc">A granary.json manifest beside its README and TypeScript standards files, with a successful validation command.</desc>
  <rect x="1" y="1" width="1118" height="548" rx="18" fill="#171c18" stroke="#394331" />
  <path d="M1 55H1119M655 55V450M1 450H1119" stroke="#394331" />
  <circle cx="28" cy="28" r="6" fill="#e78776" />
  <circle cx="50" cy="28" r="6" fill="#e6be72" />
  <circle cx="72" cy="28" r="6" fill="#95b894" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="108" y="35" fill="#bbbfb0">core-standards / granary.json</text>
    <text x="38" y="103" fill="#f5f0e6">{</text>
    <text x="58" y="147" fill="#e6be72">"name": "bytefarm/core-standards",</text>
    <text x="58" y="191" fill="#e6be72">"version": "0.1.0",</text>
    <text x="58" y="235" fill="#e6be72">"description":</text>
    <text x="80" y="271" fill="#95b894">"Functional TypeScript standards.",</text>
    <text x="58" y="315" fill="#e6be72">"entry": "README.md",</text>
    <text x="58" y="359" fill="#e6be72">"files": ["**/*.md"]</text>
    <text x="38" y="403" fill="#f5f0e6">}</text>
    <text x="692" y="103" fill="#e6be72">core-standards/</text>
    <text x="714" y="147" fill="#f5f0e6">granary.json</text>
    <text x="714" y="191" fill="#f5f0e6">README.md</text>
    <text x="714" y="235" fill="#bbbfb0">typescript/</text>
    <text x="736" y="279" fill="#bbbfb0">paradigm.md</text>
    <text x="736" y="323" fill="#bbbfb0">errors.md</text>
    <text x="714" y="367" fill="#bbbfb0">documentation/</text>
    <text x="38" y="491" fill="#bbbfb0">$ granary validate</text>
    <text x="38" y="525" fill="#95b894">Pack manifest is valid.</text>
  </g>
</svg>
